<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neko Clan Games - Puzzle</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/meowdy.css" />
</head>
<body>

  <div class="card-container">
    <div class="card">
      <p class="subtitle" id="puzzleQuestion">Loading...</p>

      <div id="hanoiMultiContainer" style="display: none;">
        <div class="letter-slots" id="letterSlots"></div>
        <div class="hanoi-selector" id="hanoiSelector"></div>
        <div class="hanoi-board-wrap" id="hanoiBoardWrap" style="display: none;"></div>
      </div>

      <div class="input-group">
        <input 
          type="text" 
          id="answerInput" 
          placeholder="enter answer..." 
          autocomplete="off"
        />
        <button id="submitBtn">Enter</button>
      </div>

      <p id="message" class="message"></p>
    </div>
  </div>

  <script src="js/meowdy.js"></script>
  <script src="js/player.js"></script>
</body>
</html>
