<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neko Clan Games - Choose Player</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="card-container">
    <div class="card">
      <h1 id="title">Who Are You?</h1>
      <p class="subtitle">Choose your path:</p>

<div class="player-select">
  <button class="player-btn" data-player="doodles">Doodles</button>
  <button class="player-btn" data-player="meowdy">Meowdy</button>
  <button class="player-btn" data-player="recal">Recal</button>
  <button class="player-btn" data-player="gh0st">Gh0st</button>
  <button class="player-btn" data-player="ieme">Ieme</button>
  <button class="player-btn guest-btn" data-player="guest">Guest</button>
</div>

<div class="secret-entry">
  <input type="text" id="secretInput" placeholder="enter password here" autocomplete="off" />
  <button id="secretSubmitBtn">Enter</button>
</div>

  <script src="js/select.js"></script>
</body>
</html>
